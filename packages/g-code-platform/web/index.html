<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G Code · 账号与余额</title><link rel="stylesheet" href="/style.css"></head><body><header><strong>G Code</strong><span>账号与余额 · 小规模试用</span><button id="refresh">刷新</button></header><main><section id="notice" role="status"></section><section id="auth" class="card"><h1>登录平台账号</h1><p>平台余额与自填 API Key 分开计费。平台请求经过第三方模型服务商，默认不保存完整提示词、代码和回答。</p><form id="login"><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" minlength="10" required></label><label class="inline"><input name="consent" type="checkbox" required>我已了解第三方服务商处理请求的说明</label><button name="action" value="login">登录</button><button name="action" value="register">注册</button></form></section><section id="account" hidden></section><nav id="nav" hidden></nav><section id="content"></section></main><script type="module" src="/app.js"></script></body></html>
